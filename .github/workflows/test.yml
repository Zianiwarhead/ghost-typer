name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pynput needs a live X display even to *import* on Linux — GitHub's
      # ubuntu runners are headless, so tests run under a virtual display.
      - name: Install Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Pytest (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -q
