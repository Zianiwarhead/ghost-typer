[project]
name = "ghost-typer"
version = "2.5.0"
description = "Realistic human-like keystroke simulation with Tk mini-GUI (Windows, macOS, Linux/SteamOS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ghost Typer Contributors" }]
keywords = ["typing", "automation", "keystroke-simulation", "tkinter", "pynput"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Topic :: Utilities",
]
dependencies = [
  "pynput>=1.7.6",
  "pyperclip>=1.8.2",
  "Pillow>=10.0.0",
  "pywin32>=306; sys_platform=='win32'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform=='darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]
gui = []

[project.scripts]
ghosttyper = "main:main"

[tool.setuptools]
py-modules = ["main", "gui"]
packages = ["core"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE", "S", "TRY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
